name: Build and Publish

on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:
    inputs:
      launcher_version:
        description: 'Versjon som skal publiseres'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAJ_VERSION: 2

jobs:
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-string.outputs.version }}

    steps:
      - name: Generate version string
        id: version-string
        shell: bash
        run: |
          if [[ -n "${{ inputs.launcher_version }}" ]]; then
              version="${{ inputs.launcher_version }}"
          else
              version="${{ env.MAJ_VERSION }}.$(date -u '+%Y.%m.%d-%H.%M')-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - calculate-version

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build
        run: ./gradlew clean assemble --refresh-dependencies --stacktrace -Dfile.encoding=UTF8 -Plauncher_version=${{ needs.calculate-version.outputs.version }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - calculate-version
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run tests
        run: ./gradlew check --continue --stacktrace -Dfile.encoding=UTF8 -Plauncher_version=${{ needs.calculate-version.outputs.version }}

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@49b2ca06f62aa7ef83ae6769a2179271e160d8e4 # v6.3.1
        with:
          report_paths: '**/build/test-results/*/*.xml'
          check_name: Test rapport
          annotate_only: true
          detailed_summary: true

  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - calculate-version
    if: (github.ref_name == 'master' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Publish to GitHub Packages
        run: ./gradlew publish --stacktrace -Dfile.encoding=UTF8 -Plauncher_version=${{ needs.calculate-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
