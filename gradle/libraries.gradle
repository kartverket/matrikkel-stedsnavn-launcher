// Build a map of the dependency artifacts to use.
// Allows centralized definition of the versions of artifacts to use.
// In that respect it serves a role similar to <dependencyManagement> in Maven
def libraries = [
      commons_compress        : 'org.apache.commons:commons-compress:1.18',
      getdown_core            : 'com.threerings.getdown:getdown-core:1.8.6',
      getdown_launcher        : 'com.threerings.getdown:getdown-launcher:1.8.6@jar',
      jsign                   : 'net.jsign:jsign-core:2.1',
      servlet_api             : 'javax.servlet:javax.servlet-api:3.1.0',
      seven_z                 : 'org.tukaani:xz:1.8',
      slf4j_api               : "org.slf4j:slf4j-api:1.8.0-beta4",
]

// Eksponerer denne for alle prosjekter
project.ext.set('libraries', libraries)
