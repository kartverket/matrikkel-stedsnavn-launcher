plugins {
    id 'java-library'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

apply from: 'gradle/defaultBuildProperties.gradle'

group = 'no.statkart.launcher'
version = launcher_version

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'NimblyGames'
        url = 'https://artifactory.nimblygames.com/artifactory/ng-public-release/'
        content {
            includeGroup 'com.badlogicgames.packr'
        }
    }
}

sourceSets {
    client
    server
    test {
        compileClasspath += sourceSets.client.output
        compileClasspath += sourceSets.server.output
        runtimeClasspath += sourceSets.client.output
        runtimeClasspath += sourceSets.server.output
    }
}

dependencies {
    clientImplementation 'com.threerings.getdown:getdown-launcher:1.8.8@jar'
    serverCompileOnly 'jakarta.servlet:jakarta.servlet-api:5.0.0'

    api 'org.apache.commons:commons-compress:1.28.0'
    implementation 'com.threerings.getdown:getdown-core:1.8.8'
    implementation 'com.badlogicgames.packr:packr-all:4.0.0'
    implementation 'net.jsign:jsign-core:4.0'
    implementation 'org.tukaani:xz:1.12'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-core:5.23.0'
}

gradlePlugin {
    plugins {
        launcherPlugin {
            //noinspection GroovyAssignabilityCheck
            id = 'no.statkart.launcher'
            //noinspection GroovyAssignabilityCheck
            implementationClass = 'no.statkart.launcher.gradle.plugin.LauncherPlugin'
        }
    }
}

// Minimumskrav til java for å bygge launcher
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// Minimumskrav til java for å bygge og kjøre klientdelen av launcher
compileClientJava {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// Minimumskrav til java for å bygge og kjøre tjenerdelen av launcher
compileServerJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Werror'
}

task clientJar(type: Jar) {
    archiveAppendix.set('client')
    from sourceSets.client.output
    destinationDirectory.set(file('build/client/lib'))
    manifest {
        attributes(
                'Implementation-Title': 'Kartverkets launcher client',
                'Implementation-Version': archiveVersion.get()
        )
    }
}

task serverJar(type: Jar) {
    archiveAppendix.set('server')
    from sourceSets.server.output
    destinationDirectory.set(file('build/server/lib'))
    manifest {
        attributes(
                'Implementation-Title': 'Kartverkets launcher server',
                'Implementation-Version': archiveVersion.get()
        )
    }
}

jar {
    into('lib/client') {
        from(clientJar)
        from(configurations.clientRuntimeClasspath)
    }
    into('lib/server') {
        from(serverJar)
        from(configurations.serverRuntimeClasspath)
    }
    manifest {
        attributes(
                'Implementation-Title': 'Kartverkets launcher plugin',
                'Implementation-Version': archiveVersion.get(),
        )
    }
}

task sourceJar(type: Jar) {
    from sourceSets.main.allSource
    from sourceSets.client.allSource
    from sourceSets.server.allSource
    archiveClassifier.set("sources")
}

tasks.withType(AbstractPublishToMaven).configureEach {
    doFirst {
        logger.lifecycle "Publishing ${publication.groupId}:${publication.artifactId}:${publication.version}"
    }
}

publishing {
    publications.all {
        if (it.name == 'pluginMaven') artifact sourceJar
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/kartverket/matrikkel-stedsnavn-launcher"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
