plugins {
    id 'java-library'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

apply from: 'gradle/defaultBuildProperties.gradle'
apply from: 'gradle/libraries.gradle'

group = 'no.statkart.launcher'
version = launcher_version

repositories {
    mavenLocal()
    maven {
        url maven_repo
    }
}

sourceSets {
    client
    server
}

dependencies {
    clientImplementation libraries.getdown_launcher
    serverImplementation libraries.getdown_core
    serverImplementation libraries.slf4j_api
    serverCompileOnly libraries.servlet_api

    api libraries.commons_compress
    api libraries.jsign
    api libraries.seven_z
}

gradlePlugin {
    plugins {
        launcherPlugin {
            id = 'no.statkart.launcher'
            implementationClass = 'no.statkart.launcher.gradle.plugin.LauncherPlugin'
        }
    }
}

// Minimumskrav til gradle byggesystemet dette pluginet brukes i.
sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

task clientJar(type: Jar) {
    archiveName "launcher-client-${archiveVersion.get()}.jar"
    from sourceSets.client.output
    destinationDir file('build/client/lib')
    manifest {
        attributes(
                'Implementation-Title': 'Kartverkets launcher client',
                'Implementation-Version': archiveVersion.get()
        )
    }
}

// Klienten som launcheren starter opp trenger denne java-versjonen.
compileClientJava {
    sourceCompatibility = JavaVersion.VERSION_12
    targetCompatibility = JavaVersion.VERSION_12
}


task serverJar(type: Jar) {
    archiveName "launcher-server-${archiveVersion.get()}.jar"
    from sourceSets.server.output
    destinationDir file('build/server/lib')
    manifest {
        attributes(
                'Implementation-Title': 'Kartverkets launcher server',
                'Implementation-Version': archiveVersion.get()
        )
    }
}

// Server-kildekoden skal deployes i en servlet-container.
// For Kartverket betyr dette per i dag weblogic - som kjører på java 1.8.
compileServerJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}


tasks.create('downloadWindowsJdk', DownloadJdk, jdk_windows_url)
tasks.create('downloadLinuxJdk', DownloadJdk, jdk_linux_url)
tasks.create('downloadOSXJdk', DownloadJdk, jdk_osx_url)

jar {
    // Pluginen trenger denne, men den ligger pt ikke i maven
    into('lib/packr') {
        from 'lib/packr-2.0-SNAPSHOT.jar'
    }
    into('jdk') {
        from(downloadWindowsJdk)
        from(downloadLinuxJdk)
        from(downloadOSXJdk)
        from('jdk') {
            include 'fonts/*'
        }
    }
    into('lib/client') {
        from(clientJar)
        from(configurations.clientRuntimeClasspath)
    }
    into('lib/server') {
        from(serverJar)
        from(configurations.serverRuntimeClasspath)
    }
    manifest {
        attributes(
                'Implementation-Title': 'Kartverkets launcher',
                'Implementation-Version': archiveVersion.get(),
                'windows-jdk-image': jdk_windows_url,
                'linux-jdk-image': jdk_linux_url,
                'osx-jdk-image': jdk_osx_url,
        )
    }
}

task sourceJar(type: Jar) {
    from sourceSets.main.allSource
    classifier "sources"
}


publishing {
    publications.all {
        if (it.name == 'pluginMaven') artifact sourceJar
    }
    repositories {
        String mavenUpload = System.getenv('MAVEN_PUBLISH')
        maven {
            if (mavenUpload) {
                String creds = mavenUpload.split('@|//').getAt(1)
                url mavenUpload.replace(creds.concat('@'), '') // url kommer i konsoll - ikke ha credentials der
                credentials {
                    username creds.split(':').getAt(0) ?: ""
                    password creds.split(':').getAt(1) ?: ""
                }
            }
        }
    }
}
